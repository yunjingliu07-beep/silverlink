name: Validate Silver Link
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - name: Build signed demo APK
        working-directory: mobile
        run: npm run apk
      - name: Prepare download
        run: |
          mkdir -p "$RUNNER_TEMP/silverlink-apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/silverlink-apk/Silver-Link-Demo-1.0.apk"
          cp mobile/README.md "$RUNNER_TEMP/silverlink-apk/README.md"
          cd "$RUNNER_TEMP/silverlink-apk"
          sha256sum Silver-Link-Demo-1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Silver-Link-Android-Demo
          path: ${{ runner.temp }}/silverlink-apk/
          retention-days: 30
